<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 3 - Waafi</title>
<style>
body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
.header { background: linear-gradient(90deg, #a8e063, #00B347); padding:15px; color:white; display:flex; justify-content:space-between; align-items:center; }
.container { padding:20px; max-width:600px; margin:auto; }
.card { background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
h2 { text-align:center; margin:0; }
.step { text-align:center; color:#888; margin-bottom:15px; }
.progress { display:flex; gap:5px; margin-bottom:20px; }
.bar { flex:1; height:6px; background:#ddd; border-radius:5px; }
.bar.active { background: linear-gradient(90deg, #a8e063, #00B347); }
label { display:block; margin:15px 0 5px 0; font-weight:bold; }
input, select { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
.summary { background:#f9f9f9; padding:15px; border-radius:8px; border-left:4px solid #00B347; margin-top:20px; }
.row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; }
.btn { width:100%; padding:16px; border:none; border-radius:8px; font-size:18px; font-weight:bold; background: linear-gradient(90deg, #a8e063, #00B347); color:white; cursor:pointer; margin-top:15px; }
.btn.gray { background:#ccc; color:#333; }
</style>
</head>
<body>
<div class="header"><div>← Back</div><h1>Enough</h1><div>☰</div></div>
<div class="container">
  <div class="card">
    <h2>Loan Application</h2>
    <div class="step">Step 3 of 3</div>
    <div class="progress"><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div></div>
    
    <label>Work Status</label>
    <select><option>Employee</option><option>Self Employed</option></select>
    
    <label>Annual Income ($)</label>
    <input type="number" placeholder="25,000">
    
    <div class="summary">
      <h3>Application Summary</h3>
      <div class="row"><span>Loan Amount:</span><span>$1,000</span></div>
      <div class="row"><span>Loan Period:</span><span>12 Months</span></div>
      <div class="row"><span>Purpose:</span><span>Business</span></div>
      <div class="row"><span>Applicant:</span><span>Ahmed Hassan</span></div>
    </div>
    
    <button class="btn gray">SO THAT</button>
    <button class="btn" onclick="alert('Application Sent!')">SEND REQUEST</button>
  </div>
</div>
</body>
</html>
