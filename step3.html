<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enough - Loan Application</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0;padding:0}
.container{max-width:500px;margin:0 auto;background:white;min-height:100vh}
.progress-wrap{padding:20px 20px 10px 20px}
.progress-wrap h2{margin:0;font-size:22px;text-align:center}
.progress-wrap p{margin:5px 0 0 0;color:#888;font-size:14px;text-align:center}
.bars{display:flex;gap:8px;margin-top:15px}
.bar{flex:1;height:6px;border-radius:10px;background:#e5e5e5}
.bar.active{background:linear-gradient(90deg,#84cc16,#65a30d)}
.form{padding:20px}
label{font-weight:bold;display:block;margin:15px 0 5px 0}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
.summary{background:#f0fff4;padding:15px;border-radius:12px;margin:20px 0;border-left:4px solid #65a30d}
.summary h3{margin:0 0 10px 0}
.row{display:flex;justify-content:space-between;margin:8px 0}
.btn{width:100%;padding:15px;background:#65a30d;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer}
</style></head><body>
<div class="container">
<div class="progress-wrap">
<h2>Loan Application</h2>
<p id="stepText">Step 3 of 4</p>
<div class="bars"><div class="bar active" id="bar1"></div><div class="bar active" id="bar2"></div><div class="bar active" id="bar3"></div><div class="bar" id="bar4"></div></div>
</div>

<div class="form">
<label>Work Status</label>
<select id="work"><option>Employee</option><option>Self Employed</option><option>Student</option></select>
<label>Annual Income ($)</label>
<input type="number" id="income" placeholder="5000">

<div class="summary">
<h3>Application Summary</h3>
<div class="row"><span>Loan Amount:</span><b id="s_amount"></b></div>
<div class="row"><span>Loan Period:</span><b id="s_period"></b></div>
<div class="row"><span>Purpose:</span><b id="s_purpose"></b></div>
<div class="row"><span>Applicant:</span><b id="s_name"></b></div>
</div>

<button class="btn" onclick="submit()">Submit Application</button>
</div>
</div>
<script>
document.getElementById('s_amount').innerText = '$' + localStorage.getItem('amount');
document.getElementById('s_period').innerText = localStorage.getItem('period');
document.getElementById('s_purpose').innerText = localStorage.getItem('purpose');
document.getElementById('s_name').innerText = localStorage.getItem('name');

function submit(){
  localStorage.setItem('work',document.getElementById('work').value);
  localStorage.setItem('income',document.getElementById('income').value);
  window.location='step4.html';
}
</script>
</body></html>
