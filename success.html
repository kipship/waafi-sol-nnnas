<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submitted</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:400px;text-align:center}
.toast{background:#1f2937;color:white;padding:15px;border-radius:12px;display:flex;align-items:center;gap:10px;margin-bottom:20px}
h2{color:#00B347;margin:15px 0}
p{color:#666;line-height:1.6}
.btn{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:white;margin-top:20px;cursor:pointer}
.loader{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top:2px solid #00B347;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card">
<div class="toast">🎉 <b>The application has been successfully submitted!</b></div>

<h2>Loan Application Submitted</h2>
<p>Your loan application has been submitted. Please wait for approval.</p>
<p>You will receive a confirmation message soon.</p>

<div style="background:#f0fff4;padding:12px;border-radius:10px;margin:20px 0;color:#00B347">
<span class="loader"></span> Redirecting in 5 seconds...
</div>

<button class="btn" onclick="window.location='index.html'">Go to Home</button>
</div>
<script>
setTimeout(()=>{window.location='index.html'}, 5000);
</script>
</body></html>
