<!DOCTYPE html><html lang="so"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaabada 1</title><style>body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:linear-gradient(90deg,#a8e063,#00B347);padding:15px;color:white;font-weight:bold;display:flex;align-items:center;gap:15px}
.container{padding:20px;max-width:600px;margin:auto}.card{background:white;padding:25px;border-radius:15px}
h2{text-align:center;margin-bottom:5px} .sub{text-align:center;color:#999;margin-bottom:20px}
.progress{display:flex;gap:8px;margin-bottom:25px} .bar{height:5px;flex:1;background:#ddd;border-radius:5px}
.bar.active{background:linear-gradient(90deg,#a8e063,#00B347)}
label{display:block;margin:15px 0 5px;font-weight:600} input,select,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px}
.btn{width:100%;padding:18px;border:none;border-radius:12px;font-size:18px;font-weight:bold;background:linear-gradient(90deg,#a8e063,#00B347);color:white;margin-top:20px}</style>
</head><body>
<div class="header">← Dib u noqo <span style="margin-left:auto">Waafi</span> ☰</div>
<div class="container"><div class="card">
<h2>Codsiga Amaahda</h2><p class="sub">Tallaabada 1 ee 3</p>
<div class="progress"><div class="bar active"></div><div class="bar"></div><div class="bar"></div></div>

<label>Nooca Amaahda</label>
<select id="type"><option>Amaah Shakhsi ah</option><option>Amaah Ganacsi</option><option>Amaah Waxbarasho</option><option>Amaah Guri</option></select>

<label>Qaddarka Amaahda ($)</label><input id="amount" type="number" value="1000">

<label>Muddada Amaahda</label>
<select id="period"><option>12 Bilood</option><option>24 Bilood</option><option>36 Bilood</option><option>60 Bilood</option></select>

<label>Ujeedada Amaahda</label><textarea id="purpose" rows="3" placeholder="Maxaad u isticmaali doontaa amaahda?"></textarea>

<button class="btn" onclick="save1()">TALLAABADA XIGTA</button>
</div></div>
<script>function save1(){
localStorage.setItem('waafi_step1',JSON.stringify({type:type.value,amount:amount.value,period:period.value,purpose:purpose.value}));
location.href='step2.html';
}</script></body></html>
