<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAAFI - Apply Now</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; background: #f5f5f5; }
    .container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; padding: 20px; }
    .header { text-align: center; padding: 20px 0; border-bottom: 2px solid #009639; }
    .logo { font-size: 32px; font-weight: bold; color: #009639; }
    .form-title { text-align: center; color: #009639; font-size: 22px; margin: 25px 0; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
    .form-group input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
    .form-group input:focus { border-color: #009639; outline: none; }
    .btn { width: 100%; background: #009639; color: white; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #00B347; }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: #009639; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">WAAFI</div>
  </div>
  
  <h2 class="form-title">Loan Application - Step 1</h2>
  
  <form>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" placeholder="61x xxx" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" placeholder="your@email.com" required>
    </div>
    
    <button type="button" class="btn" onclick="window.location.href='step2.html'">CONTINUE</button>
  </form>
  
  <div class="back">
    <a href="index.html">← Back to Home</a>
  </div>
</div>
</body>
</html>
