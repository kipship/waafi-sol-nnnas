<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Step 1</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0}.header{background:linear-gradient(90deg,#b8e600,#00B347);padding:15px;color:white;text-align:center;font-weight:bold}.container{padding:20px;max-width:600px;margin:auto}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.option{padding:15px;border:2px solid #ddd;border-radius:10px;text-align:center;cursor:pointer;font-weight:bold}.option.selected{border-color:#00B347;background:#e8f5e9}label{display:block;margin:15px 0 5px;font-weight:bold}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{width:100%;padding:16px;border:none;border-radius:8px;font-size:18px;font-weight:bold;background:linear-gradient(90deg,#b8e600,#00B347);color:white;cursor:pointer;margin-top:10px}.progress{display:flex;justify-content:space-between;margin-bottom:20px;font-size:14px}.step{color:#999}.step.active{color:#00B347;font-weight:bold}</style>
</head><body><div class="header">Enough - Loan Application</div><div class="container">
<div class="progress"><div class="step active">1. Loan</div><div class="step">2. Personal</div><div class="step">3. Work</div><div class="step">4. Submit</div></div>
<div class="card"><h3>Step 1: Loan Details</h3>
<label>Loan Type</label><div class="grid">
<div class="option" onclick="selectLoan(this,'Personal Loan')">Personal</div>
<div class="option" onclick="selectLoan(this,'Business Loan')">Business</div>
<div class="option" onclick="selectLoan(this,'Education Loan')">Education</div>
<div class="option" onclick="selectLoan(this,'Home Loan')">Home</div></div>
<label>Loan Amount ($)</label><input id="amount" type="number" placeholder="5000">
<label>Loan Period</label><select id="period"><option>12 months</option><option>24 months</option><option>36 months</option></select>
<label>Loan Purpose</label><input id="purpose" placeholder="e.g. Business capital">
<button class="btn" onclick="saveStep1()">NEXT</button></div></div>
<script>let loanType='';function selectLoan(el,type){document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');loanType=type;}
function saveStep1(){if(!loanType)return alert('Select loan type');if(!document.getElementById('amount').value)return alert('Enter amount');
localStorage.setItem('waafi_step1',JSON.stringify({loanType,amount:amount.value,period:period.value,purpose:purpose.value}));location.href='step2.html';}</script></body></html>
