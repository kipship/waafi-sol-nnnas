<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 1 - Waafi</title>
<style>
body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
.header { background: linear-gradient(90deg, #a8e063, #00B347); padding:15px; color:white; display:flex; justify-content:space-between; align-items:center; }
.container { padding:20px; max-width:600px; margin:auto; }
.card { background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
h2 { text-align:center; margin:0; }
.step { text-align:center; color:#888; margin-bottom:15px; }
.progress { display:flex; gap:5px; margin-bottom:20px; }
.bar { flex:1; height:6px; background:#ddd; border-radius:5px; }
.bar.active { background: linear-gradient(90deg, #a8e063, #00B347); }
label { display:block; margin:15px 0 5px 0; font-weight:bold; }
input, select { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
.btn { width:100%; padding:16px; border:none; border-radius:8px; font-size:18px; font-weight:bold; background: linear-gradient(90deg, #a8e063, #00B347); color:white; cursor:pointer; margin-top:20px; }
</style>
</head>
<body>
<div class="header"><div>← Back</div><h1>Enough</h1><div>☰</div></div>
<div class="container">
  <div class="card">
    <h2>Loan Application</h2>
    <div class="step">Step 1 of 3</div>
    <div class="progress"><div class="bar active"></div><div class="bar"></div><div class="bar"></div></div>
    
    <label>Loan Type</label>
    <select><option>Personal Loan</option><option>Business Loan</option></select>
    
    <label>Loan Amount ($)</label>
    <input type="number" placeholder="1000">
    
    <label>Loan Period</label>
    <select><option>12 Months</option><option>24 Months</option></select>
    
    <label>Purpose of Loan</label>
    <input type="text" placeholder="What will you use the loan for?">
    
    <button class="btn" onclick="window.location.href='step2.html'">NEXT STEP</button>
  </div>
</div>
</body>
</html>
