<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAAFI - Loan Application</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Arial', sans-serif; 
      background: #f5f5f5; 
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      padding: 20px 0;
    }
    .logo { 
      font-size: 36px; 
      font-weight: bold; 
      color: #009639; /* WAAFI GREEN */
      letter-spacing: 2px;
    }
    .subtitle { 
      color: #666; 
      font-size: 16px;
      margin-top: 5px;
    }
    .hero {
      text-align: center;
      padding: 30px 0;
    }
    .hero h2 { 
      color: #009639; 
      font-size: 24px;
      margin-bottom: 10px;
    }
    .hero p {
      color: #555;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .btn { 
      background: #009639; /* GREEN */
      color: white; 
      padding: 16px 45px; 
      border: none; 
      border-radius: 30px; 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer; 
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,150,57,0.3);
      transition: 0.3s;
    }
    .btn:hover { 
      background: #00B347; /* LIGHT GREEN */
      transform: translateY(-2px);
    }
    .features {
      margin: 40px 0;
      padding: 0 10px;
    }
    .feature {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 12px;
    }
    .feature-icon {
      font-size: 40px;
      margin-right: 15px;
    }
    .feature-text h3 {
      font-size: 17px;
      margin-bottom: 3px;
    }
    .feature-text p {
      color: #777;
      font-size: 14px;
    }
    .footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px 0;
      color: #999;
      font-size: 13px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">WAAFI</div>
    <p class="subtitle">Financial Solutions for You</p>
  </div>

  <div class="hero">
    <h2>Easy Loan Application</h2>
    <p>Get your loan approved in 24 hours. Quick, Easy, and Secure.</p>
    <a href="step1.html" class="btn">APPLY NOW</a>
  </div>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">⚡</div>
      <div class="feature-text">
        <h3>Fast Approval</h3>
        <p>Within 24 hours</p>
      </div>
    </div>
    <div class="feature">
      <div class="feature-icon">💰</div>
      <div class="feature-text">
        <h3>Low Price</h3>
        <p>Starting at 18%</p>
      </div>
    </div>
    <div class="feature">
      <div class="feature-icon">🔒</div>
      <div class="feature-text">
        <h3>Safe</h3>
        <p>Bank account</p>
      </div>
    </div>
  </div>

  <div class="footer">
    © 2026 Wafi Somalia. All rights reserved.
  </div>
</div>

</body>
</html>
