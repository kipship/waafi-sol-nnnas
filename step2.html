<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAAFI - Loan Details</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; background: #f5f5f5; }
    .container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; padding: 20px; }
    .header { text-align: center; padding: 20px 0; border-bottom: 2px solid #009639; }
    .logo { font-size: 32px; font-weight: bold; color: #009639; }
    .progress { display: flex; justify-content: space-between; margin: 20px 0; }
    .step { flex: 1; text-align: center; padding: 10px; background: #ddd; color: #666; margin: 0 5px; border-radius: 8px; font-weight: bold; }
    .step.active { background: #009639; color: white; }
    .form-title { text-align: center; color: #009639; font-size: 22px; margin: 25px 0; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
    .form-group input, .form-group select { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
    .form-group input:focus, .form-group select:focus { border-color: #009639; outline: none; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .btn-back { background: #ccc; color: #333; }
    .btn-next { background: #009639; color: white; }
    .btn-next:hover { background: #00B347; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">WAAFI</div>
  </div>
  
  <div class="progress">
    <div class="step">1. Personal</div>
    <div class="step active">2. Loan</div>
    <div class="step">3. Submit</div>
  </div>
  
  <h2 class="form-title">Loan Details</h2>
  
  <form>
    <div class="form-group">
      <label>Loan Amount (USD)</label>
      <input type="number" placeholder="e.g. 5000" required>
    </div>
    <div class="form-group">
      <label>Loan Purpose</label>
      <select required>
        <option value="">Select purpose</option>
        <option>Business</option>
        <option>Education</option>
        <option>Medical</option>
        <option>Home</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Repayment Period (Months)</label>
      <input type="number" placeholder="e.g. 12" required>
    </div>
    
    <div class="btn-group">
      <button type="button" class="btn btn-back" onclick="window.location.href='step1.html'">BACK</button>
      <button type="submit" class="btn btn-next">CONTINUE</button>
    </div>
  </form>
</div>
</body>
</html>
