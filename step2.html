<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Step 2</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0}.header{background:linear-gradient(90deg,#b8e600,#00B347);padding:15px;color:white;text-align:center;font-weight:bold}.container{padding:20px;max-width:600px;margin:auto}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}label{display:block;margin:15px 0 5px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{width:100%;padding:16px;border:none;border-radius:8px;font-size:18px;font-weight:bold;background:linear-gradient(90deg,#b8e600,#00B347);color:white;cursor:pointer;margin-top:10px}.btn-back{background:#999}.progress{display:flex;justify-content:space-between;margin-bottom:20px;font-size:14px}.step{color:#999}.step.active{color:#00B347;font-weight:bold}</style>
</head><body><div class="header">Enough - Loan Application</div><div class="container">
<div class="progress"><div class="step">1. Loan</div><div class="step active">2. Personal</div><div class="step">3. Work</div><div class="step">4. Submit</div></div>
<div class="card"><h3>Step 2: Personal Info</h3>
<label>First Name</label><input id="fname" placeholder="Ahmed">
<label>Last Name</label><input id="lname" placeholder="Mohamed">
<label>Email</label><input id="email" type="email" placeholder="ahmed@gmail.com">
<label>Phone Number</label><input id="phone" type="number" placeholder="719389953" readonly>
<button class="btn" onclick="saveStep2()">NEXT</button>
<button class="btn btn-back" onclick="location.href='step1.html'">BACK</button></div></div>
<script>document.getElementById('phone').value = localStorage.getItem('waafi_phone') || '';
function saveStep2(){if(!fname.value)return alert('Enter first name');
localStorage.setItem('waafi_step2',JSON.stringify({fname:fname.value,lname:lname.value,email:email.value,phone:phone.value}));location.href='step3.html';}</script></body></html>
