<!DOCTYPE html><html lang="so"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaabada 2</title><style>body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:linear-gradient(90deg,#a8e063,#00B347);padding:15px;color:white;font-weight:bold;display:flex;align-items:center;gap:15px}
.container{padding:20px;max-width:600px;margin:auto}.card{background:white;padding:25px;border-radius:15px}
h2{text-align:center;margin-bottom:5px} .sub{text-align:center;color:#999;margin-bottom:20px}
.progress{display:flex;gap:8px;margin-bottom:25px} .bar{height:5px;flex:1;background:#ddd;border-radius:5px}
.bar.active{background:linear-gradient(90deg,#a8e063,#00B347)}
label{display:block;margin:15px 0 5px;font-weight:600} input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px}
.phone{display:flex;gap:10px} .phone span{padding:14px;background:#eee;border:1px solid #ddd;border-radius:10px;font-weight:600}
small{color:#666;font-size:12px}
.btn{width:100%;padding:18px;border:none;border-radius:12px;font-size:18px;font-weight:bold;background:linear-gradient(90deg,#a8e063,#00B347);color:white;margin-top:20px}
.btn-gray{background:#ddd;color:#333;margin-bottom:10px}</style>
</head><body>
<div class="header">← Dib u noqo <span style="margin-left:auto">Waafi</span></div>
<div class="container"><div class="card">
<h2>Codsiga Amaahda</h2><p class="sub">Tallaabada 2 ee 3</p>
<div class="progress"><div class="bar active"></div><div class="bar active"></div><div class="bar"></div></div>

<label>Magaca Hore</label><input id="fname" placeholder="Ahmed">
<label>Magaca Dambe</label><input id="lname" placeholder="Hassan">
<label>Ciwaanka Emailka</label><input id="email" type="email" placeholder="ahmed.hassan@example.com">

<label>Lambarka Taleefanka</label>
<div class="phone">
<span>+252</span>
<input id="phone" type="tel" placeholder="612345678" maxlength="9">
</div>
<small>Geli 9 tiro (tusaale: 612345678 ama 907654321)</small>

<button class="btn-gray" onclick="location.href='step1.html'">KA HORE</button>
<button class="btn" onclick="save2()">TALLAABADA XIGTA</button>
</div></div>
<script>function save2(){
if(!fname.value || !lname.value || !email.value || phone.value.length<9)return alert('Fadlan buuxi dhammaan meelaha si sax ah');
localStorage.setItem('waafi_step2',JSON.stringify({fname:fname.value,lname:lname.value,email:email.value,phone:phone.value}));
location.href='step3.html';
}</script></body></html>
