<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enough - Loan Application</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0;padding:0}
.container{max-width:500px;margin:0 auto;background:white;min-height:100vh}
.progress-wrap{padding:20px 20px 10px 20px}
.progress-wrap h2{margin:0;font-size:22px;text-align:center}
.progress-wrap p{margin:5px 0 0 0;color:#888;font-size:14px;text-align:center}
.bars{display:flex;gap:8px;margin-top:15px}
.bar{flex:1;height:6px;border-radius:10px;background:#e5e5e5}
.bar.active{background:linear-gradient(90deg,#84cc16,#65a30d)}
.form{padding:20px}
label{font-weight:bold;display:block;margin:15px 0 5px 0}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
.btn{width:100%;padding:15px;background:#65a30d;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}
</style></head><body>
<div class="container">
<div class="progress-wrap">
<h2>Loan Application</h2>
<p id="stepText">Step 2 of 4</p>
<div class="bars"><div class="bar active" id="bar1"></div><div class="bar active" id="bar2"></div><div class="bar" id="bar3"></div><div class="bar" id="bar4"></div></div>
</div>

<div class="form">
<label>Full Name</label>
<input type="text" id="name" placeholder="John Doe">
<label>Phone Number</label>
<input type="text" id="phone" placeholder="+252 61xxxxxxx">
<label>ID Number</label>
<input type="text" id="idnum" placeholder="12345678">
<button class="btn" onclick="next()">Continue</button>
</div>
</div>
<script>
function next(){
  localStorage.setItem('name',document.getElementById('name').value);
  localStorage.setItem('phone',document.getElementById('phone').value);
  localStorage.setItem('idnum',document.getElementById('idnum').value);
  window.location='step3.html';
}
</script>
</body></html>
