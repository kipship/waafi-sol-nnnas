<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submitted</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:400px;text-align:center}
.toast{background:#1f2937;color:white;padding:15px;border-radius:12px;display:flex;align-items:center;gap:10px;margin-bottom:20px;font-size:14px}
h2{color:#00B347;margin:15px 0;font-size:24px}
p{color:#666;line-height:1.6;margin:10px 0}
.btn{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:white;margin-top:20px;cursor:pointer}
.loader{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top:2px solid #00B347;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.timer-box{background:#f0fff4;padding:12px;border-radius:10px;margin:20px 0;color:#00B347}
</style></head><body>
<div class="card">
<div class="toast">🎉 <b>The application has been successfully submitted!</b></div>

<h2>Loan Application Submitted</h2>
<p>Your loan application has been submitted. Please wait for approval.</p>
<p>You will receive a confirmation message soon.</p>

<div class="timer-box">
<span class="loader"></span>Redirecting in 5 seconds...
</div>

<button class="btn" onclick="window.location='index.html'">Go to Home</button>
</div>
<script>
let count = 5;
const timer = setInterval(()=>{
  count--;
  document.querySelector('.timer-box').innerHTML = `<span class="loader"></span>Redirecting in ${count} seconds...`;
  if(count <= 0){
    clearInterval(timer);
    window.location='index.html';
  }
}, 1000);
</script>
</body></html>
