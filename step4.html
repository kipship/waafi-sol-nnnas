<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enough - Application Submitted</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.container{max-width:500px;width:100%}
.progress-wrap{padding:20px 0 10px 0}
.progress-wrap h2{margin:0;font-size:22px;text-align:center;color:#65a30d}
.progress-wrap p{margin:5px 0 0 0;color:#888;font-size:14px;text-align:center}
.bars{display:flex;gap:8px;margin-top:15px}
.bar{flex:1;height:6px;border-radius:10px;background:#e5e5e5}
.bar.active{background:linear-gradient(90deg,#84cc16,#65a30d)}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center}
.toast{background:#1f2937;color:white;padding:15px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;font-size:14px;font-weight:bold}
h2{color:#65a30d;margin:15px 0;font-size:24px}
p{color:#666;line-height:1.6;margin:10px 0}
.timer-box{background:#f0fff4;padding:12px;border-radius:12px;margin:20px 0;color:#65a30d;font-weight:500}
.btn{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:white;margin-top:15px;cursor:pointer;font-weight:bold}
.loader{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top:2px solid #65a30d;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="container">
<div class="progress-wrap">
<h2>Loan Application</h2>
<p id="stepText">Step 4 of 4</p>
<div class="bars"><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div><div class="bar active"></div></div>
</div>

<div class="card">
<div class="toast">🎉 The application has been successfully submitted!</div>
<h2>Loan Application Submitted</h2>
<p>Thank you for applying to Enough.</p>
<p>Our team will review your application and contact you soon.</p>
<div class="timer-box"><span class="loader"></span>Redirecting to login in 5 seconds...</div>
<button class="btn" onclick="window.location='login.html'">Go to Login Now</button> <!-- CHANGED -->
</div>
</div>
<script>
localStorage.clear(); // Clear old data for next person
let count = 5;
const timer = setInterval(()=>{
  count--;
  document.querySelector('.timer-box').innerHTML = `<span class="loader"></span>Redirecting to login in ${count} seconds...`; // CHANGED
  if(count <= 0){clearInterval(timer);window.location='login.html';} // CHANGED
}, 1000);
</script>
</body></html>
